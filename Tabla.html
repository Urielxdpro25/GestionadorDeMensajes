<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | GDM</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: linear-gradient(90deg, #0f5739, #3d8e66, #45c9a4, #46b5a9, #52c9eb);
        padding: 20px 10px;
        min-height: 100vh;
    }

    h1 {
        color: white;
        text-align: center;
        margin-bottom: 25px;
        font-size: 2rem;
    }

    .table-container {
        max-width: 1100px;
        margin: 0 auto;
        overflow-x: auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        padding: 15px;
    }

    .top-bar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 10px;
    }

    button {
        background: #0f5739;
        color: white;
        border: none;
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.95rem;
    }

    button:hover {
        background: #0b422c;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
    }

    th,
    td {
        padding: 12px 14px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
    }

    th {
        background: #0f5739;
        color: white;
        font-weight: bold;
    }
</style>

<body class="body">
    <h1>Agenda de conferencias</h1>

    <div class="table-container">


        <table id="tablaAgenda">
            <thead>
                <tr>
                    <th id="NomCon">Nombre y apellido</th>
                    <th id="TConfe">Título conferencia</th>
                    <th id="NConfe">Número conferencia</th>
                    <th id="TCan">Título cántico</th>
                    <th id="NCan">Número cántico</th>
                    <th id="NCongre">Nombre congregación</th>
                    <th id="FAsig">Fecha asignación</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <br>

        <button onclick="agregarFila()">Agregar renglón</button>

    </div>

    <script>
        function agregarFila() {
            const tabla = document.getElementById('tablaAgenda').querySelector('tbody');
            const fila = document.createElement('tr');

            fila.innerHTML = `
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            `;

            tabla.appendChild(fila);
        }
    </script>

</body>

</html>
